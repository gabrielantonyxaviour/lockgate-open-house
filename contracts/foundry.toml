[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
# Legacy codegen hits stack-too-deep once PricingMath.quote is inlined into the credit line.
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./"}]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 40
depth = 25
fail_on_revert = false

# G6 gate: FOUNDRY_PROFILE=core forge test
# This Foundry build has no --profile flag. Default src stays "src".
[profile.core]
src = "src/core"
test = "test/core"

[profile.core.fuzz]
runs = 512

[profile.core.invariant]
runs = 64
depth = 40
fail_on_revert = false
